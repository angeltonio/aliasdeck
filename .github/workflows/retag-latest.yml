name: Retag latest

# Points the mutable latest tag at an already-published release image.
#
# The container workflow publishes latest with every stable release, so this
# is a repair tool, not part of the release path: it exists for the case
# where latest drifted onto an image that no release owns. It copies an
# existing manifest and never builds, so the release digest it points at
# stays byte-identical to what the release published.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release tag to promote (for example, v0.5.5)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/angeltonio/aliasdeck-server
      VERSION: ${{ inputs.version }}
    steps:
      - name: Require a stable release tag
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version '$VERSION' must be a stable vX.Y.Z tag" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the published digest for that release
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [ -z "$digest" ]; then
            echo "no published image found for $IMAGE:$VERSION" >&2
            exit 1
          fi
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "resolved $IMAGE:$VERSION -> $digest"

      - name: Point latest at that digest without rebuilding
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

      - name: Verify latest and the release now resolve to the same image
        run: |
          latest="$(docker buildx imagetools inspect "$IMAGE:latest" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "latest -> $latest"
          echo "$VERSION -> $DIGEST"
          test "$latest" = "$DIGEST"
