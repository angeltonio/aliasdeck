name: Publish container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Image version (for example, v0.5.0)
        required: true
        type: string
      source_ref:
        description: Git ref to build (for example, v0.5.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Remove leading v from image version
        run: echo "VERSION_NO_V=${VERSION#v}" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ inputs.version || github.ref_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/angeltonio/aliasdeck-server
          tags: |
            type=raw,value=${{ env.VERSION_NO_V }}
            type=raw,value=${{ inputs.version || github.ref_name }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
