name: Publish container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Image version (for example, v0.5.0)
        required: true
        type: string
      source_ref:
        description: Git ref to build (for example, v0.5.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify image version and source tag
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: >-
          go run ./internal/releasecheck/cmd
          --version "$RELEASE_VERSION"
          --source-ref "$RELEASE_SOURCE_REF"

      - name: Remove leading v from image version
        run: echo "VERSION_NO_V=${VERSION#v}" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ inputs.version || github.ref_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/angeltonio/aliasdeck-server
          # The release-binding check above already refused anything that is
          # not a stable vX.Y.Z tag built from that same tag, so latest can
          # only ever move to a real release. It is a convenience pointer for
          # discovery; deployments pin a digest instead (compose.prod.yaml).
          tags: |
            type=raw,value=${{ env.VERSION_NO_V }}
            type=raw,value=${{ inputs.version || github.ref_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
