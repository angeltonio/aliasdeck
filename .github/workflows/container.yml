name: Publish container

# Manual republish only. release.yml owns the image on a tag push: it builds
# once, publishes every tag from that single build, and does so only after
# goreleaser has written the notes that tell an operator to back up the
# database before upgrading. This workflow stays for the case where an image
# has to be rebuilt for a release that already exists.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version (for example, v0.5.0)
        required: true
        type: string
      source_ref:
        description: Git ref to build (for example, v0.5.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify image version and source tag
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: >-
          go run ./internal/releasecheck/cmd
          --version "$RELEASE_VERSION"
          --source-ref "$RELEASE_SOURCE_REF"

      - name: Remove leading v from image version
        run: echo "VERSION_NO_V=${VERSION#v}" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ inputs.version || github.ref_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/angeltonio/aliasdeck-server
          # latest belongs to release.yml, which publishes it only after
          # goreleaser has written the notes that tell an operator to back up
          # the database. Pushing it here too would race that build for the
          # same pointer, and the winner would be whichever job finished last.
          tags: |
            type=raw,value=${{ env.VERSION_NO_V }}
            type=raw,value=${{ inputs.version || github.ref_name }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
