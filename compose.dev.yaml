name: aliasdeck-dev

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    stop_grace_period: 5s
    ports:
      - "127.0.0.1:${ALIASDECK_DEV_PORT:-8088}:8080"
    environment:
      # Docker bridge peers are not loopback inside the container. This trust
      # assertion is safe only with the host-loopback publish above.
      ALIASDECK_LOCAL_SETUP: "true"
      # Enrollment commands generated by this dedicated dev server install a
      # fast watcher explicitly; production keeps the validated 30s default.
      ALIASDECK_ENROLLMENT_WATCH_INTERVAL: "5s"
      # The browser reaches the dev container through this host-loopback port.
      ALIASDECK_PUBLIC_URL: "http://127.0.0.1:8088"
    volumes:
      # Air only needs to read source; build output stays under container /tmp.
      - type: bind
        source: .
        target: /workspace
        read_only: true
      # `down` preserves server state; `make dev-reset` removes it explicitly.
      - server-data:/data

volumes:
  server-data:
