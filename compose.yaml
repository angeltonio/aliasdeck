# Try AliasDeck's server and web UI locally:
#
#   ALIASDECK_ADMIN_PASSWORD=pick-a-real-one docker compose up --build
#
# Then open http://127.0.0.1:8088 and log in as `admin`.
#
# The host port defaults to 8088 rather than 8080 because 8080 is one of the
# most contended ports on a developer machine — anything already bound there
# makes this fail to start with an error about the port, not about AliasDeck.
# Override it with ALIASDECK_PORT if 8088 is taken too.

services:
  aliasdeck-server:
    build: .
    # Published to loopback on purpose. Drop the 127.0.0.1 prefix and the
    # control plane is on your LAN over plaintext HTTP, with one password in
    # front of it. If you want that, put TLS in front too.
    ports:
      - "127.0.0.1:${ALIASDECK_PORT:-8088}:8080"
    environment:
      # Without this, the server generates a password and — because a
      # container's stdout is not a terminal — writes it to a 0600 file
      # *inside* the container, where reaching it means `docker exec`.
      # Setting it here is the container-shaped answer to design decision 22.
      ALIASDECK_ADMIN_PASSWORD: ${ALIASDECK_ADMIN_PASSWORD:?set it, minimum 12 characters}
    volumes:
      # Named volume, so `docker compose down` does not wipe the database.
      # `down -v` still will, which is what you want to start clean.
      - aliasdeck-data:/data
    restart: unless-stopped

volumes:
  aliasdeck-data:
