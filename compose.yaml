# Try AliasDeck's server and web UI locally:
#
#   ALIASDECK_LOCAL_SETUP=true docker compose up --build
#
# Then open http://127.0.0.1:8088/setup and create the first operator.
#
# The host port defaults to 8088 rather than 8080 because 8080 is one of the
# most contended ports on a developer machine — anything already bound there
# makes this fail to start with an error about the port, not about AliasDeck.
# Override it with ALIASDECK_PORT if 8088 is taken too.

services:
  aliasdeck-server:
    build: .
    # Published to loopback on purpose. Drop the 127.0.0.1 prefix and the
    # control plane is on your LAN over plaintext HTTP, with one password in
    # front of it. If you want that, put TLS in front too.
    ports:
      - "127.0.0.1:${ALIASDECK_PORT:-8088}:8080"
    environment:
      # Docker bridge traffic is not loopback inside the container. This
      # explicit trust assertion is safe only while the published host port
      # above remains bound to 127.0.0.1. Do not pair it with 0.0.0.0 or a
      # LAN-facing publish.
      ALIASDECK_LOCAL_SETUP: ${ALIASDECK_LOCAL_SETUP:-false}
      # Behind TLS termination, set this to the exact external origin (for
      # example https://aliases.example). It controls Secure cookies and the
      # URL rendered into enrollment commands; proxy headers are not trusted.
      ALIASDECK_PUBLIC_URL: ${ALIASDECK_PUBLIC_URL:-}
    volumes:
      # Named volume, so `docker compose down` does not wipe the database.
      # `down -v` still will, which is what you want to start clean.
      - aliasdeck-data:/data
    restart: unless-stopped

volumes:
  aliasdeck-data:
