<!doctype html>
<html lang="{{.Lang}}">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>{{tr .Lang "login.title"}} · AliasDeck</title><link rel="stylesheet" href="/static/style.css" /></head>
<body>
  <div class="auth-language">{{template "language_selector" .}}</div>
  <div class="login-shell"><div class="login-card">
    <h1>AliasDeck</h1>
    <p class="sub">{{tr .Lang "login.subtitle"}}</p>
    {{if .SetupAvailable}}<p class="sub">{{tr .Lang "login.setup_available"}}</p>{{end}}
    {{if .Error}}<div class="error-banner">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <div class="field"><label for="username">{{tr .Lang "field.username"}}</label><input type="text" id="username" name="username" value="{{.Username}}" autocomplete="username" required /></div>
      <div class="field"><label for="password">{{tr .Lang "field.password"}}</label><input type="password" id="password" name="password" autocomplete="current-password" required /></div>
      <button type="submit">{{tr .Lang "login.submit"}}</button>
    </form>
  </div></div>
</body>
</html>
