# GoReleaser configuration for AliasDeck (PROJECT.md §9.5, §16 Milestones 2-3).
#
# RELEASE PREREQUISITE — READ BEFORE TAGGING
#
# `homebrew_casks:` publishes a cask to angeltonio/homebrew-tap and `scoops:`
# publishes a manifest to angeltonio/scoop-bucket. Both repositories exist with
# a `main` branch; GoReleaser creates `Casks/` and `bucket/` and commits into
# them.
#
# (`scoops` is the current, non-deprecated key — verified against the installed
# `goreleaser jsonschema`. There is no `scoop_buckets` or singular `scoop`.)
#
# Both need a token that can push outside this repository. The GITHUB_TOKEN
# Actions injects is scoped to the workflow's own repository and can write to
# neither. GORELEASER_PUBLISH_TOKEN supplies it, and one token serves both
# blocks rather than one each: the same workflow uses them in the same step for
# the same purpose, so a second secret would add an expiry to track without
# isolating anything. Its fine-grained scope names both repositories, and any
# repository added below has to be added there too.
#
# Getting that wrong fails late and confusingly: the binaries build, the GitHub
# release publishes, and only then does the Homebrew or Scoop step reject the
# push — leaving a half-finished release to unpick from a CI log.
#
# Releasing locally from a machine whose gh token already carries `repo` scope
# needs no PAT — point the same variable at it:
#
#   export GORELEASER_PUBLISH_TOKEN=$(gh auth token)
#
# Either way, run `goreleaser release --snapshot --clean` first to check the
# build without publishing anything.

version: 2

project_name: aliasdeck

before:
  hooks:
    - go mod tidy

# Two builds, two archive sets: the client (cmd/aliasdeck) and the server
# (cmd/aliasdeck-server) ship as separate binaries (design decision
# reversing the earlier single-binary model, docs/WHAT-WE-ARE-BUILDING.md).
# Twelve build artifacts total (six platforms × two binaries) instead of
# six — the cost named in that document as the price of the split.
builds:
  - id: aliasdeck
    main: ./cmd/aliasdeck
    binary: aliasdeck
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # -s -w strips the symbol table and DWARF debug info; there is no
    # main.version var to inject yet (cmd/aliasdeck reports its version via
    # internal/app.Version instead), so ldflags stays minimal rather than
    # referencing a symbol that does not exist.
    ldflags:
      - -s -w

  - id: aliasdeck-server
    main: ./cmd/aliasdeck-server
    binary: aliasdeck-server
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: aliasdeck
    ids:
      - aliasdeck
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    # Windows users expect zip, not tar.gz; Scoop itself extracts zip
    # archives, so this also keeps the Scoop manifest below (which points at
    # this same archive) working without an extra unpack step.
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: aliasdeck-server
    ids:
      - aliasdeck-server
    name_template: >-
      {{ .ProjectName }}-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Casks, not formulae. GoReleaser deprecated `brews` because the formulae it
# generated for pre-compiled binaries were a workaround for a problem Homebrew
# solves properly with casks.
#
# `ids: [aliasdeck]` is load-bearing, not incidental: it is what makes
# `brew install aliasdeck` install the 3.3 MB client archive and nothing
# else (docs/WHAT-WE-ARE-BUILDING.md). The server is never published here —
# it ships as its own release binaries and, primarily, as a container.
homebrew_casks:
  - name: aliasdeck
    # `auto` skips publishing to the package manager when the tag looks like a
    # prerelease (anything with a hyphen, e.g. v0.3.0-rc.1). Without it, an rc
    # tag would push a release candidate to everyone running `brew upgrade`.
    # Set explicitly rather than relying on the default, because the cost of
    # being wrong here is shipping an untested build to every installed user.
    skip_upload: auto
    ids:
      - aliasdeck
    binaries:
      - aliasdeck
    repository:
      owner: angeltonio
      name: homebrew-tap
      branch: main
      # Always required, in CI and locally. Without it GoReleaser falls back to
      # GITHUB_TOKEN, which in Actions is scoped to this repository and cannot
      # push to the tap.
      #
      # Locally:  export GORELEASER_PUBLISH_TOKEN=$(gh auth token)
      # In CI:    a PAT stored as the GORELEASER_PUBLISH_TOKEN secret
      token: "{{ .Env.GORELEASER_PUBLISH_TOKEN }}"
    homepage: "https://github.com/angeltonio/aliasdeck"
    description: "Your commands. Every machine. Compiles neutral aliases into shell-specific syntax."
    url:
      verified: github.com/angeltonio/aliasdeck
    hooks:
      post:
        # These binaries are not signed or notarized, so macOS quarantines
        # anything downloaded and refuses to run it. Without this the install
        # succeeds and the first `aliasdeck` invocation fails with a message
        # about an unverified developer — which looks like a broken tool rather
        # than an unsigned one.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/aliasdeck"]
          end
    caveats: |
      Get started with:
        aliasdeck init
        aliasdeck edit
        aliasdeck sync

# Windows counterpart of homebrew_casks above. Fails loudly (build error, not
# a silent skip) if angeltonio/scoop-bucket or its token is missing, since
# both are release prerequisites, not optional extras — see the comment at
# the top of this file.
#
# `ids: [aliasdeck]` is the same client-only scoping as homebrew_casks
# above: `scoop install aliasdeck` gets the client, never the server.
scoops:
  - name: aliasdeck
    # `auto` skips publishing to the package manager when the tag looks like a
    # prerelease (anything with a hyphen, e.g. v0.3.0-rc.1). Without it, an rc
    # tag would push a release candidate to everyone running `brew upgrade`.
    # Set explicitly rather than relying on the default, because the cost of
    # being wrong here is shipping an untested build to every installed user.
    skip_upload: auto
    ids:
      - aliasdeck
    repository:
      owner: angeltonio
      name: scoop-bucket
      branch: main
      # Reuses the same GORELEASER_PUBLISH_TOKEN as homebrew_casks rather than
      # a second secret; see the top-of-file comment for why. Its scope names
      # this repository as well as the tap.
      token: "{{ .Env.GORELEASER_PUBLISH_TOKEN }}"
    # Scoop looks for manifests in bucket/ by convention. Without this the
    # manifest lands at the repository root, where `scoop install` will not
    # find it — and the bucket's own README already points readers at bucket/.
    directory: bucket
    homepage: "https://github.com/angeltonio/aliasdeck"
    description: "Your commands. Every machine. Compiles neutral aliases into shell-specific syntax."
    license: MIT

release:
  github:
    owner: angeltonio
    name: aliasdeck
  prerelease: auto
  # v0.3 ships an embedded SQLite database and forward-only migrations
  # (goose, internal/store/migrations). This footer is permanent, not
  # v0.3-specific: every release from here on can migrate a database that a
  # later downgrade would then refuse to open, so every release's own notes
  # must carry the recovery path — not just the one that introduced it.
  footer: |
    ### Before you upgrade a running server

    **Back up your database file first.** Migrations are forward-only: once
    a database has been migrated by a newer binary, an older binary refuses
    to start against it (`schema is newer than this binary`) rather than
    migrating it down or silently corrupting it. If you upgrade, decide you
    want the previous version back, and only then think about a backup, it
    is too late — restoring the database file you backed up *before*
    upgrading is the only way back down; there is no downgrade command.

    **First-run operator setup.** On a brand-new database, open `/setup`
    directly from the server host to create the operator username and
    password without reading a separate setup credential. This shortcut is
    accepted only from a direct loopback HTTP connection; remote and proxied
    requests must use the one-time credential written to
    `setup-credential.txt` beside the database. For non-interactive or
    headless deployments, set `ALIASDECK_ADMIN_PASSWORD` before the first
    start to create the `admin` operator without using the browser setup.

    **The default bind is loopback only.** `aliasdeck-server` with no
    `--addr` binds `127.0.0.1:8080` and nothing else. Reaching it from
    another machine requires an explicit, wider `--addr` — a deliberate
    operator choice, not a default to work around.

    **Do not front the sync endpoint with a redirecting proxy.** `GET
    /api/v1/sync` refuses every HTTP redirect outright, on purpose — a
    same-host, scheme-downgrading redirect would otherwise resend a
    device's bearer token in cleartext. Terminate TLS and forward the
    request directly; a 301/302 in front of this one route will just look
    like the device is offline.
