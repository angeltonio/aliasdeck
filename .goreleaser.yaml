# GoReleaser configuration for AliasDeck (PROJECT.md §9.5, §16 Milestones 2-3).
#
# RELEASE PREREQUISITE — READ BEFORE TAGGING v0.1
#
# The `homebrew_casks:` block below publishes a cask to angeltonio/homebrew-tap.
# That repository now exists with a `main` branch; GoReleaser creates the
# `Casks/` directory and commits into it.
#
# The `scoops:` block below publishes a manifest to angeltonio/scoop-bucket
# the same way (`scoops` is the current, non-deprecated key for this in
# GoReleaser v2 — verified against the installed `goreleaser jsonschema`;
# there is no separate `scoop_buckets`/`scoop` key to confuse it with). That
# repository now exists too, with a `main` branch and a README; GoReleaser
# creates the `bucket/` directory and commits into it.
#
# What is still required for BOTH is a token that can push there. The
# GITHUB_TOKEN GitHub Actions injects is scoped to the repository running the
# workflow and cannot write to either the tap or the bucket. Releasing from
# CI needs a separate PAT (classic with `repo`, or fine-grained with
# Contents: write on the target repo) exposed as GORELEASER_TAP_TOKEN, reused
# for both `homebrew_casks` and `scoops` below rather than a second secret —
# same as the tap, one PAT covers both, provided its fine-grained scope is
# widened to include angeltonio/scoop-bucket. If that scope has not been
# widened yet, the Scoop push fails exactly the way an unset token fails the
# Homebrew step: late, after the binaries and GitHub release already
# published.
#
# Getting this wrong fails late and confusingly: the binaries build, the
# GitHub release publishes, and only then does the Homebrew or Scoop step
# reject the push — leaving a half-finished release to unpick from a CI log.
#
# Releasing locally from a machine whose gh token already carries `repo`
# scope needs no PAT — just point the same variable at it:
#
#   export GORELEASER_TAP_TOKEN=$(gh auth token)
#
# Either way, run `goreleaser release --snapshot --clean` first to check the
# build without publishing anything.

version: 2

project_name: aliasdeck

before:
  hooks:
    - go mod tidy

builds:
  - id: aliasdeck
    main: ./cmd/aliasdeck
    binary: aliasdeck
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # -s -w strips the symbol table and DWARF debug info; there is no
    # main.version var to inject yet (cmd/aliasdeck reports its version via
    # internal/app.Version instead), so ldflags stays minimal rather than
    # referencing a symbol that does not exist.
    ldflags:
      - -s -w

archives:
  - id: aliasdeck
    ids:
      - aliasdeck
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    # Windows users expect zip, not tar.gz; Scoop itself extracts zip
    # archives, so this also keeps the Scoop manifest below (which points at
    # this same archive) working without an extra unpack step.
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Casks, not formulae. GoReleaser deprecated `brews` because the formulae it
# generated for pre-compiled binaries were a workaround for a problem Homebrew
# solves properly with casks.
homebrew_casks:
  - name: aliasdeck
    ids:
      - aliasdeck
    binaries:
      - aliasdeck
    repository:
      owner: angeltonio
      name: homebrew-tap
      branch: main
      # Always required, in CI and locally. Without it GoReleaser falls back to
      # GITHUB_TOKEN, which in Actions is scoped to this repository and cannot
      # push to the tap.
      #
      # Locally:  export GORELEASER_TAP_TOKEN=$(gh auth token)
      # In CI:    a PAT stored as the GORELEASER_TAP_TOKEN secret
      token: "{{ .Env.GORELEASER_TAP_TOKEN }}"
    homepage: "https://github.com/angeltonio/aliasdeck"
    description: "Your commands. Every machine. Compiles neutral aliases into shell-specific syntax."
    url:
      verified: github.com/angeltonio/aliasdeck
    hooks:
      post:
        # These binaries are not signed or notarized, so macOS quarantines
        # anything downloaded and refuses to run it. Without this the install
        # succeeds and the first `aliasdeck` invocation fails with a message
        # about an unverified developer — which looks like a broken tool rather
        # than an unsigned one.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/aliasdeck"]
          end
    caveats: |
      Get started with:
        aliasdeck init
        aliasdeck edit
        aliasdeck sync

# Windows counterpart of homebrew_casks above. Fails loudly (build error, not
# a silent skip) if angeltonio/scoop-bucket or its token is missing, since
# both are release prerequisites, not optional extras — see the comment at
# the top of this file.
scoops:
  - name: aliasdeck
    ids:
      - aliasdeck
    repository:
      owner: angeltonio
      name: scoop-bucket
      branch: main
      # Reuses the same GORELEASER_TAP_TOKEN as homebrew_casks rather than a
      # second secret. See the top-of-file comment: its fine-grained scope
      # may need widening to cover angeltonio/scoop-bucket too, since it was
      # originally issued for angeltonio/homebrew-tap only.
      token: "{{ .Env.GORELEASER_TAP_TOKEN }}"
    homepage: "https://github.com/angeltonio/aliasdeck"
    description: "Your commands. Every machine. Compiles neutral aliases into shell-specific syntax."
    license: MIT

release:
  github:
    owner: angeltonio
    name: aliasdeck
  prerelease: auto
