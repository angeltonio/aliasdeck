# GoReleaser configuration for AliasDeck (PROJECT.md §9.5, §16 Milestones 2-3).
#
# RELEASE PREREQUISITE — READ BEFORE TAGGING
#
# `homebrew_casks:` publishes a cask to angeltonio/homebrew-tap and `scoops:`
# publishes a manifest to angeltonio/scoop-bucket. Both repositories exist with
# a `main` branch; GoReleaser creates `Casks/` and `bucket/` and commits into
# them.
#
# (`scoops` is the current, non-deprecated key — verified against the installed
# `goreleaser jsonschema`. There is no `scoop_buckets` or singular `scoop`.)
#
# Both need a token that can push outside this repository. The GITHUB_TOKEN
# Actions injects is scoped to the workflow's own repository and can write to
# neither. GORELEASER_PUBLISH_TOKEN supplies it, and one token serves both
# blocks rather than one each: the same workflow uses them in the same step for
# the same purpose, so a second secret would add an expiry to track without
# isolating anything. Its fine-grained scope names both repositories, and any
# repository added below has to be added there too.
#
# Getting that wrong fails late and confusingly: the binaries build, the GitHub
# release publishes, and only then does the Homebrew or Scoop step reject the
# push — leaving a half-finished release to unpick from a CI log.
#
# Releasing locally from a machine whose gh token already carries `repo` scope
# needs no PAT — point the same variable at it:
#
#   export GORELEASER_PUBLISH_TOKEN=$(gh auth token)
#
# Either way, run `goreleaser release --snapshot --clean` first to check the
# build without publishing anything.

version: 2

project_name: aliasdeck

before:
  hooks:
    - go mod tidy

builds:
  - id: aliasdeck
    main: ./cmd/aliasdeck
    binary: aliasdeck
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # -s -w strips the symbol table and DWARF debug info; there is no
    # main.version var to inject yet (cmd/aliasdeck reports its version via
    # internal/app.Version instead), so ldflags stays minimal rather than
    # referencing a symbol that does not exist.
    ldflags:
      - -s -w

archives:
  - id: aliasdeck
    ids:
      - aliasdeck
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    # Windows users expect zip, not tar.gz; Scoop itself extracts zip
    # archives, so this also keeps the Scoop manifest below (which points at
    # this same archive) working without an extra unpack step.
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Casks, not formulae. GoReleaser deprecated `brews` because the formulae it
# generated for pre-compiled binaries were a workaround for a problem Homebrew
# solves properly with casks.
homebrew_casks:
  - name: aliasdeck
    ids:
      - aliasdeck
    binaries:
      - aliasdeck
    repository:
      owner: angeltonio
      name: homebrew-tap
      branch: main
      # Always required, in CI and locally. Without it GoReleaser falls back to
      # GITHUB_TOKEN, which in Actions is scoped to this repository and cannot
      # push to the tap.
      #
      # Locally:  export GORELEASER_PUBLISH_TOKEN=$(gh auth token)
      # In CI:    a PAT stored as the GORELEASER_PUBLISH_TOKEN secret
      token: "{{ .Env.GORELEASER_PUBLISH_TOKEN }}"
    homepage: "https://github.com/angeltonio/aliasdeck"
    description: "Your commands. Every machine. Compiles neutral aliases into shell-specific syntax."
    url:
      verified: github.com/angeltonio/aliasdeck
    hooks:
      post:
        # These binaries are not signed or notarized, so macOS quarantines
        # anything downloaded and refuses to run it. Without this the install
        # succeeds and the first `aliasdeck` invocation fails with a message
        # about an unverified developer — which looks like a broken tool rather
        # than an unsigned one.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/aliasdeck"]
          end
    caveats: |
      Get started with:
        aliasdeck init
        aliasdeck edit
        aliasdeck sync

# Windows counterpart of homebrew_casks above. Fails loudly (build error, not
# a silent skip) if angeltonio/scoop-bucket or its token is missing, since
# both are release prerequisites, not optional extras — see the comment at
# the top of this file.
scoops:
  - name: aliasdeck
    ids:
      - aliasdeck
    repository:
      owner: angeltonio
      name: scoop-bucket
      branch: main
      # Reuses the same GORELEASER_PUBLISH_TOKEN as homebrew_casks rather than
      # a second secret; see the top-of-file comment for why. Its scope names
      # this repository as well as the tap.
      token: "{{ .Env.GORELEASER_PUBLISH_TOKEN }}"
    # Scoop looks for manifests in bucket/ by convention. Without this the
    # manifest lands at the repository root, where `scoop install` will not
    # find it — and the bucket's own README already points readers at bucket/.
    directory: bucket
    homepage: "https://github.com/angeltonio/aliasdeck"
    description: "Your commands. Every machine. Compiles neutral aliases into shell-specific syntax."
    license: MIT

release:
  github:
    owner: angeltonio
    name: aliasdeck
  prerelease: auto
